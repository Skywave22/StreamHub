name: streamhub
description: "StreamHub - a fast, modern cross-platform streaming application with a modular provider/plugin architecture."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.1.0

  # Navigation
  go_router: ^17.0.1

  # Networking
  dio: ^5.9.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.4
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4

  # Images
  cached_network_image: ^3.4.1

  # Playback
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.6

  # Misc
  url_launcher: ^6.3.1
  package_info_plus: ^9.0.1
  wakelock_plus: ^1.4.0
  crypto: ^3.0.6
  intl: ^0.20.2
  flutter_js: ^0.8.5
  html: ^0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
